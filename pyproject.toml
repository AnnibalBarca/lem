[project]
name = "lem"
version = "0.1.0"
description = "Moteur d'apprentissage du lexique français : carte de connaissance, FSRS, jeux modulaires."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "fsrs>=6.0",
    "wordfreq>=3.1",
    "numpy>=1.26",
    "pydantic>=2.6",
    "rapidfuzz>=3.6",
    "httpx>=0.27",
    "marisa-trie>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
lem = "lem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
